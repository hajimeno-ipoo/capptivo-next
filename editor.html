<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capptivo_Next</title>
    <!--
      Splash paints before Vite/React. Inline only — no extra CSS request,
      no splash window, removed once the editor/library shell is ready.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f4f8ff;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #f4f8ff;
        color: #24344d;
        transition: opacity 180ms ease-out;
        pointer-events: none;
      }
      html.dark,
      html.dark body,
      html.dark #splash {
        background: #18283d;
      }
      html.dark #splash {
        color: #f5f9ff;
      }
      #splash.is-hiding {
        opacity: 0;
      }
      #splash-brand {
        display: flex;
        align-items: center;
        gap: 18px;
        font: 600 clamp(20px, 3vw, 28px) / 1.2 system-ui, sans-serif;
        letter-spacing: -0.03em;
      }
      #splash-brand img {
        width: 72px;
        height: 72px;
        flex: none;
        border-radius: 21%;
      }
    </style>
    <script>
      try {
        const theme = localStorage.getItem("capptivo.theme");
        if (theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch { /* The light theme remains available without storage. */ }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Orbitron:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="splash" aria-busy="true" aria-label="Loading Capptivo_Next">
      <div id="splash-brand">
        <img
          src="/splash-icon.png"
          alt=""
          width="72"
          height="72"
          decoding="sync"
          fetchpriority="high"
        />
        <span>Capptivo_Next</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/windows/editor/main.tsx"></script>
  </body>
</html>
